- id: RingTon
  name: Ring Tone
  associated_with_account: true
  associated_with_button: false
  params:
    - id: type
      label: Type
      type: hidden
      value: ring_tone
      config_template: ""
    - id: file
      label: Ring Tone File
      type: string
      config_template: ""
    - id: volume
      label: Volume
      type: number
      config_template: ""
    - id: repeat
      label: Repeat
      type: number
      config_template: |-
        # Функция {{name}}: {{file}}, громкость={{volume}}, повтор={{repeat}}
        sip line{{account_number}} ringtone: {{file}}
        # Note: custom ringtone volume/repeat are often set globally or via specific params
    - id: new_param
      label: Label
      type: string
      config_template: config_template
