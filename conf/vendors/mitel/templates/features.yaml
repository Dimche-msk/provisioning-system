- id: speeddial
  name: Speed Dial
  associated_with_account: false
  associated_with_button: true
  params:
    - id: type
      label: Type
      type: hidden
      value: speeddial
      config_template: '{{tag}}{{key_index}} type: {{value}}'
    - id: value
      label: Number
      type: string
      config_template: '{{tag}}{{key_index}} value: {{value}}'
    - id: label
      label: Label
      type: string
      config_template: '{{tag}}{{key_index}} label: {{value}}'
    - id: line
      label: Line
      type: select
      config_template: '{{tag}}{{key_index}} line: {{value}}'
      source: accounts
