id: yealink-SIP-T46U
name: Yealink SIP-T46U
image: Yealink-T46U.png
type: phone
own_hard_keys: 10
max_account_lines: 16
maximum_expansion_modules: 3
supported_expansion_modules:
  - EXP43
keys:
  # Line Keys
  - index: 1 # default line
    type: linekey
    label: "Line 1"
    x: 320
    y: 120
  - index: 2
    type: linekey
    label: "Line 2"
    x: 320
    y: 148
  - index: 3
    type: linekey
    label: "Line 3"
    x: 320
    y: 175
  - index: 4
    type: linekey
    label: "Line 4"
    x: 320
    y: 202
  - index: 5
    type: linekey
    label: "Line 5"
    x: 320
    y: 228
  - index: 6
    type: linekey
    label: "Line 6"
    x: 690
    y: 120
  - index: 7
    type: linekey
    label: "Line 7"
    x: 690
    y: 148
  - index: 8
    type: linekey
    label: "Line 8"
    x: 690
    y: 175
  - index: 9
    type: linekey
    label: "Line 9"
    x: 690
    y: 202
  - index: 10
    type: linekey
    label: "Line 10"
    x: 690
    y: 228

  # Soft Keys (offset 100)
  - index: 101
    type: softkey
    label: "Softkey 1"
    x: 350
    y: 400
    settings: { type: "programablekey", label: "programablekey", value: "programablekey" }
  - index: 102
    type: softkey
    label: "Softkey 2"
    x: 450
    y: 400
    settings: { type: "programablekey", label: "programablekey", value: "programablekey" }
  - index: 103
    type: softkey
    label: "Softkey 3"
    x: 550
    y: 400
    settings: { type: "programablekey", label: "programablekey", value: "programablekey" }
  - index: 104
    type: softkey
    label: "Softkey 4"
    x: 650
    y: 400
    settings: { type: "programablekey", label: "programablekey", value: "programablekey" }

key_types:
  - id: linekey
    verbose: "Line Key"
  - id: softkey
    verbose: "Soft Key"

settings:
  - group: "Pickup Features"
    params:
      - key: "features.pickup.blf_audio_enable"
        label: "BLF Audio Enable"
        type: boolean
        default: 1
      - key: "features.pickup.direct_pickup_code"
        label: "Direct Pickup Code"
        type: string
        default: "*8#"
