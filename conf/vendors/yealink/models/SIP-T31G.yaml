id: yealink-SIP-T31G
name: Yealink SIP-T31G
image: Yealink-T31G.png
type: phone
own_hard_keys: 4
max_account_lines: 2
maximum_expansion_modules: 0
keys:
  - index: 1
    type: linekey
    label: "Line 1"
    x: 418
    y: 86
  - index: 2
    type: linekey
    label: "Line 2"
    x: 418
    y: 110

  - index: 101
    type: softkey
    label: "Softkey 1"
    x: 50
    y: 200
    settings: { type: "programablekey", label: "programablekey", value: "programablekey" }
  - index: 102
    type: softkey
    label: "Softkey 2"
    x: 150
    y: 200
    settings: { type: "programablekey", label: "programablekey", value: "programablekey" }
  - index: 103
    type: softkey
    label: "Softkey 3"
    x: 250
    y: 200
    settings: { type: "programablekey", label: "programablekey", value: "programablekey" }
  - index: 104
    type: softkey
    label: "Softkey 4"
    x: 350
    y: 200
    settings: { type: "programablekey", label: "programablekey", value: "programablekey" }

key_types:
  - id: linekey
    verbose: "Line Key"
  - id: softkey
    verbose: "Soft Key"

settings:
  - group: "Pickup Features"
    params:
      - key: "features.pickup.blf_audio_enable"
        label: "BLF Audio Enable"
        type: boolean
        default: 1
      - key: "features.pickup.direct_pickup_code"
        label: "Direct Pickup Code"
        type: string
        default: "*8#"
