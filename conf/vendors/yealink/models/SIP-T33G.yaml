id: yealink-SIP-T33G
name: Yealink SIP-T33G
image: Yealink-T33G.png
type: phone
own_hard_keys: 4
max_account_lines: 4
maximum_expansion_modules: 0
keys:
  # Line Keys
  - index: 1
    type: linekey
    label: "Line 1"
    x: 418
    y: 86
  - index: 2
    type: linekey
    label: "Line 2"
    x: 418
    y: 110
  - index: 3
    type: linekey
    label: "Line 3"
    x: 418
    y: 134
  - index: 4
    type: linekey
    label: "Line 4"
    x: 418
    y: 158

  # Softkeys (offset 100)
  - index: 101
    type: softkey
    label: "Softkey 1"
    x: 50
    y: 200
    settings: { type: "programablekey", label: "programablekey", value: "programablekey" }
  - index: 102
    type: softkey
    label: "Softkey 2"
    x: 150
    y: 200
    settings: { type: "programablekey", label: "programablekey", value: "programablekey" }
  - index: 103
    type: softkey
    label: "Softkey 3"
    x: 250
    y: 200
    settings: { type: "programablekey", label: "programablekey", value: "programablekey" }
  - index: 104
    type: softkey
    label: "Softkey 4"
    x: 350
    y: 200
    settings: { type: "programablekey", label: "programablekey", value: "programablekey" }

key_types:
  - id: linekey
    verbose: "Line Key"
  - id: softkey
    verbose: "Soft Key"

settings:
  - group: "Pickup Features"
    params:
      - key: "features.pickup.blf_audio_enable"
        label: "BLF Audio Enable"
        type: boolean
        default: 1
      - key: "features.pickup.direct_pickup_code"
        label: "Direct Pickup Code"
        type: string
        default: "*8#"
